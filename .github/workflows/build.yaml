name: Build

# PRs run the module tests and build the image to validate the Dockerfile;
# pushes to main also push it to GHCR under the Caddy version and sha- tags.
on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

jobs:
  build-and-push:
    name: Test, Build and Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: decompress/go.mod
          cache: false
      - run: go test ./...
        working-directory: decompress
      - name: Image tags
        id: meta
        run: |
          version=$(sed -n 's/^FROM caddy:\([0-9.]*\)-alpine$/\1/p' Dockerfile)
          test -n "$version"
          {
            echo "version=${version}"
            echo "sha=sha-$(echo "$GITHUB_SHA" | cut -c1-7)"
          } >> "$GITHUB_OUTPUT"
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/cowprotocol/caddy:${{ steps.meta.outputs.version }}
            ghcr.io/cowprotocol/caddy:${{ steps.meta.outputs.sha }}
